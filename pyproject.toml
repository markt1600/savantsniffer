[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "savantsniffer"
version = "0.1.0"
description = "Local, observe-first discovery and control for a Lutron/Savant system you own."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "python-dotenv>=1.0.0", "Flask>=3.0.0"]

[project.optional-dependencies]
leap = ["pylutron-caseta>=0.18.0"]

[project.scripts]
lutron = "savantsniffer.cli:main"
savantsniffer-web = "savantsniffer.webapp:main"

[tool.setuptools]
packages = ["savantsniffer"]

[tool.setuptools.package-data]
savantsniffer = ["templates/*.html", "static/*"]
